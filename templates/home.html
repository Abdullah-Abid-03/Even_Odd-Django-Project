<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math Checker</title>
    <style>
        body {
            background: linear-gradient(to right, #74ebd5, #acb6e5);
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }
        .container {
            background-color: white;
            display: inline-block;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            margin: 15px auto;
            width: 200px;
            padding: 12px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            font-size: 16px;
            border-radius: 8px;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background-color: #2c80b4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Math Checker</h1>
        <a href="{% url 'evenodd' %}" class="btn">Even or Odd</a>
        <a href="{% url 'palind'%}" class="btn">Palindrome Checker</a>
        <a href="{% url  'prime' %}" class="btn">Prime or Composite</a>
    </div>
</body>
</html>
